name: PennyWise
options:
  bundleIdPrefix: com.pennywise
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: PennyWise
    # Stable code signing so macOS TCC grants (Screen Recording, Camera, Mic)
    # persist across rebuilds instead of resetting like ad-hoc signing does.
    DEVELOPMENT_TEAM: "43HHN9A4KG"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  PennyWise:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pennywise.PennyWise
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: PennyWise.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5.0"
